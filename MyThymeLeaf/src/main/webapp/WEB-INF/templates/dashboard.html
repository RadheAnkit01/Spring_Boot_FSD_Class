<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HomePage</title>
</head>
<body>
    <div th:insert="~{fragments/header :: header}" style="border: 2px solid black"></div>
    <div style="min-height: 50px"><h1>I'm Radhe, Using th:insert</h1></div>
    <div th:insert="~{fragments/footer :: footer}" style="border: 2px solid red"></div>
    <div style="min-height: 200px"></div>
    <div th:replace="~{fragments/header :: header}" style="border: 2px solid black"></div>
    <div style="min-height: 50px"><h1>I'm Radhe, Using th:replace</h1></div>
    <div th:replace="~{fragments/footer :: footer}" style="border: 2px solid red"></div>
</body>
</html>
