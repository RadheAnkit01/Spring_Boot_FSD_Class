<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Departments</title>
</head>
<body>

<h2>Department List</h2>

<a th:href="@{/department/add}">
    <button type="button">Add Department</button>
</a>

<br><br>

<p th:if="${departments == null or departments.isEmpty()}">
    No department found.
</p>

<table th:if="${departments != null and !departments.isEmpty()}"
       border="1" cellpadding="10">

    <thead>
    <tr>
        <th>Department ID</th>
        <th>Department Name</th>
        <th>Department Location</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="department : ${departments}">
        <td th:text="${department.departmentId}"></td>
        <td th:text="${department.departmentName}"></td>
        <td th:text="${department.departmentLocation}"></td>
    </tr>
    </tbody>

</table>

</body>
</html>
